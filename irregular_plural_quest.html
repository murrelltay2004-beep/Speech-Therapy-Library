<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plural Power-Up</title><style>body{font-family:system-ui;background:#eef4fc;color:#193050;margin:0}header{background:#173b70;color:white;padding:22px;text-align:center}main{max-width:780px;margin:20px auto;padding:0 15px}.card{background:white;border-radius:18px;padding:22px;margin-bottom:15px;box-shadow:0 4px 18px #183a6a16}button,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #a8bbd3;background:white;cursor:pointer}button:hover{background:#e8f1ff}.primary{background:#205caa;color:white;border:0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.options button{font-size:20px;min-height:65px}.correct{background:#c6f2d9!important;border-color:#24865b}.wrong{background:#ffe1df!important;border-color:#bc4848}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none}.prompt{font-size:26px;font-weight:750;text-align:center;margin:22px 0}.emoji{font-size:54px;text-align:center}.tag{background:#e5effb;padding:8px 12px;border-radius:20px;font-size:14px}#feedback{font-weight:650;min-height:30px}label{display:flex;flex-direction:column;gap:4px;font-weight:650}#bar{height:10px;border-radius:10px;background:#d9e5f4;overflow:hidden}#fill{height:100%;background:#39947c;width:0}small{color:#526782}@media(max-width:520px){.options{grid-template-columns:1fr}.prompt{font-size:22px}}</style></head><body><header><h1>🐭➡️🐭🐭 Plural Power-Up!</h1><div>Irregular Plural Nouns • Speech & Language Game</div></header><main><section class="card"><div class="flex"><label>Difficulty<select id="level"><option value="easy">Beginner (common words)</option><option value="medium">Intermediate</option><option value="hard">Advanced</option><option value="mix">Mixed levels</option></select></label><label>Practice mode<select id="mode"><option value="choice">Choose the plural</option><option value="type">Say it / type it</option><option value="sentence">Complete a sentence</option></select></label><label>Round length<select id="length"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><button class="primary" id="start">New round</button></div><p><small>Students can respond aloud; the clinician can score answers. Type mode also accepts typed responses. Words and answer positions are shuffled each round.</small></p></section><section id="game" class="card"><div class="flex"><span class="tag" id="counter"></span><span class="tag" id="score"></span><span class="tag" id="hintCount"></span></div><div id="bar" style="margin-top:15px"><div id="fill"></div></div><div id="emoji" class="emoji"></div><div id="prompt" class="prompt"></div><div id="options" class="options"></div><div id="typing" class="hidden"><input id="entry" style="font:inherit;padding:14px;width:85%;border-radius:10px;border:1px solid #9eb2cc" placeholder="Type the plural here (or say it aloud)"><div class="flex" style="margin-top:12px"><button id="check" class="primary">Check typed answer</button><button id="spoken">✓ Correct when spoken</button><button id="missed">Needs practice</button></div></div><p id="feedback" aria-live="polite"></p><div class="flex"><button id="hint">💡 Hint</button><button id="reveal">Show answer</button><button id="next" class="primary hidden">Next →</button></div></section><section id="end" class="card hidden" style="text-align:center"><h2>🎉 Round complete!</h2><p id="result"></p><button id="again" class="primary">Play again</button></section></main><script>
const words=[
['mouse','mice','🐭','easy','mouses','mousees','mices','There are two ___ in the kitchen.','Change -ouse to -ice.'],['child','children','🧒','easy','childs','childes','childrens','Three ___ played at the park.','The plural ends in -ren.'],['man','men','👨','easy','mans','mens','manies','Two ___ are talking.','Change the vowel a to e.'],['woman','women','👩','easy','womans','womens','womanes','Two ___ are reading.','The vowel changes in the plural.'],['foot','feet','🦶','easy','foots','feets','footies','My two ___ are cold.','Change oo to ee.'],['tooth','teeth','🦷','easy','tooths','teeths','toothes','Brush all your ___ .','Change oo to ee.'],['goose','geese','🪿','easy','gooses','geeses','goosies','The ___ swam across the pond.','Change oo to ee.'],['person','people','👥','easy','persons','peoples','persones','Five ___ stood in line.','The word changes completely.'],['fish','fish','🐟','medium','fishes','fishs','fishies','We saw six ___ in the lake.','The plural can stay the same.'],['sheep','sheep','🐑','medium','sheeps','sheepes','sheepies','Four ___ were grazing.','The plural stays the same.'],['deer','deer','🦌','medium','deers','deeres','deeries','Three ___ crossed the road.','The plural stays the same.'],['ox','oxen','🐂','medium','oxes','oxs','oxens','The farmer owned two ___ .','Add -en, not -s.'],['wolf','wolves','🐺','medium','wolfs','wolfes','wolvies','Two ___ howled at night.','Change f to ves.'],['knife','knives','🔪','medium','knifes','knifees','knivs','Put the ___ in the drawer.','Change fe to ves.'],['leaf','leaves','🍂','medium','leafs','leafes','leavs','The ___ fell from the tree.','Change f to ves.'],['life','lives','💚','medium','lifes','lifees','livies','The rescue team saved two ___ .','Change fe to ves.'],['loaf','loaves','🍞','medium','loafs','loafes','loavs','We bought two ___ of bread.','Change f to ves.'],['cactus','cacti','🌵','hard','cactuseses','cactis','cactusies','Several ___ grew in the desert.','One traditional plural ends in -i.'],['fungus','fungi','🍄','hard','funguseses','fungis','fungies','Different ___ grow in damp places.','One traditional plural ends in -i.'],['criterion','criteria','📋','hard','criterionses','criterias','criterionies','The judges used three ___ .','Change -on to -a.'],['phenomenon','phenomena','🌠','hard','phenomenonses','phenomenas','phenomenonies','Scientists studied unusual ___ .','Change -on to -a.'],['analysis','analyses','📊','hard','analysises','analysiss','analysisies','The researchers compared their ___ .','Change -is to -es.'],['crisis','crises','⚠️','hard','crisises','crisiss','crisisies','The leaders responded to several ___ .','Change -is to -es.'],['thesis','theses','📚','hard','thesises','thesiss','thesisies','The students defended their ___ .','Change -is to -es.'],['index','indices','📖','hard','indexesies','indexs','indexies','The math book included several ___ .','A formal plural ends in -ices.']];
const $=x=>document.getElementById(x);let deck=[],i=0,correct=0,hints=0,done=false,hinted=false,options=[];function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(){let level=$('level').value;let pool=words.filter(w=>level==='mix'||w[3]==='easy'||(level==='medium'&&w[3]==='medium')||(level==='hard'&&w[3]==='hard'));if(level==='easy')pool=words.filter(w=>w[3]==='easy');if(level==='medium')pool=words.filter(w=>w[3]!=='hard');let n=+$('length').value;deck=[];while(deck.length<n)deck.push(...shuffle(pool).slice(0,n-deck.length));i=0;correct=0;hints=0;$('game').classList.remove('hidden');$('end').classList.add('hidden');render()}
function render(){let w=deck[i],mode=$('mode').value;done=false;hinted=false;$('counter').textContent=`Question ${i+1} / ${deck.length}`;$('score').textContent=`Correct: ${correct}`;$('hintCount').textContent=`Hints: ${hints}`;$('fill').style.width=(100*i/deck.length)+'%';$('emoji').textContent=w[2];$('prompt').textContent=mode==='sentence'?w[7]:`One ${w[0]} ... two ____?`;$('feedback').textContent='';$('next').classList.add('hidden');$('hint').disabled=false;$('reveal').disabled=false;$('options').classList.toggle('hidden',mode==='type');$('typing').classList.toggle('hidden',mode!=='type');$('entry').value='';$('options').replaceChildren();if(mode!=='type'){options=shuffle([w[1],w[4],w[5],w[6]]);options.forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(o===w[1],b);$('options').appendChild(b)})}}
function answer(ok,b){if(done)return;let w=deck[i];if(ok){done=true;correct++;$('score').textContent=`Correct: ${correct}`;if(b)b.classList.add('correct');$('feedback').textContent=`✓ Yes! One ${w[0]}, two ${w[1]}.`;finishQuestion()}else{if(b){b.classList.add('wrong');b.disabled=true}$('feedback').textContent='Not quite. Try again, or use a hint.'}}
function finishQuestion(){done=true;$('next').classList.remove('hidden');$('hint').disabled=true;$('reveal').disabled=true;[...$('options').children].forEach(b=>b.disabled=true)}
$('check').onclick=()=>{let w=deck[i];answer($('entry').value.trim().toLowerCase()===w[1],null)};$('spoken').onclick=()=>answer(true,null);$('missed').onclick=()=>{if(done)return;$('feedback').textContent=`Practice: one ${deck[i][0]}, two ${deck[i][1]}.`;finishQuestion()};$('hint').onclick=()=>{if(!hinted){hints++;hinted=true;$('hintCount').textContent=`Hints: ${hints}`} $('feedback').textContent='💡 '+deck[i][8]};$('reveal').onclick=()=>{if(done)return;$('feedback').textContent=`Answer: ${deck[i][1]}. Say it aloud in a sentence!`;finishQuestion()};$('next').onclick=()=>{i++;if(i===deck.length){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent=`${correct} of ${deck.length} correct • ${hints} hints used. Great practice!`}else render()};$('start').onclick=start;$('again').onclick=start;start();
</script></body></html>
