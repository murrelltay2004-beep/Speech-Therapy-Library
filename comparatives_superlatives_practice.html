<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparatives & Superlatives Practice</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#203047;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:850px;margin:24px auto;background:white;border-radius:24px;padding:35px;box-shadow:0 10px 35px #20304716}h1{font-size:clamp(26px,4vw,40px);margin:0 0 8px}.sub{color:#61718a}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.bar{height:12px;background:#e8edf5;border-radius:12px;margin:25px 0;overflow:hidden}.fill{height:100%;background:#3975d7;transition:width .2s}.question{font-size:clamp(26px,4.5vw,42px);font-weight:bold;line-height:1.4;margin:25px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{border:3px solid #d8e1ef;background:#fff;border-radius:18px;padding:22px;font-size:clamp(22px,3vw,30px);font-weight:700;cursor:pointer;color:#203047}.choice:hover{border-color:#3975d7;background:#f1f6ff}.choice.correct{background:#e3f8e8;border-color:#27974e}.choice.wrong{background:#fff0ed;border-color:#cf604d}.feedback{min-height:75px;margin:22px 0;font-size:21px;line-height:1.5}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{background:#3975d7;color:white;border:0;border-radius:12px;padding:14px 24px;font-size:18px;font-weight:700;cursor:pointer}.btn.secondary{background:#e8edf5;color:#203047}.btn:disabled{opacity:.35;cursor:default}.foot{font-size:15px;color:#61718a;margin-top:20px}.end{display:none;text-align:center}.end h2{font-size:34px}@media(max-width:550px){body{padding:8px}.wrap{padding:20px;margin:8px auto}.answers{grid-template-columns:1fr}.choice{padding:16px}}</style></head><body><main class="wrap"><div id="game"><div class="top"><div><h1>Word Comparison Challenge</h1><div class="sub">Comparatives &amp; Superlatives</div></div><strong id="counter"></strong></div><div class="bar"><div class="fill" id="progress"></div></div><div class="sub">Choose the word that completes the sentence.</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" id="prev">← Previous</button><button class="btn secondary" id="hint">Hint</button><button class="btn" id="next">Next →</button></div><div class="foot">Say the complete sentence aloud after choosing your answer.</div></div><div class="end" id="end"><h2>Great work!</h2><p id="summary"></p><button class="btn" id="restart">Practice Again</button></div></main><script>
const data=[
["A bicycle is ___ than a car.","slower","slowest",0],["Of the three buildings, the school is the ___.","taller","tallest",1],["This box is ___ than that box.","heavier","heaviest",0],["Of all the puppies, Max is the ___.","smaller","smallest",1],["Today is ___ than yesterday.","warmer","warmest",0],["Of the three runners, Mia is the ___.","faster","fastest",1],["My pencil is ___ than yours.","shorter","shortest",0],["Of all the rooms, the kitchen is the ___.","brighter","brightest",1],["An elephant is ___ than a horse.","bigger","biggest",0],["Of the three roads, this one is the ___.","longer","longest",1],["This blanket is ___ than that towel.","softer","softest",0],["Of the four children, Ben is the ___.","younger","youngest",1],["The blue bag is ___ than the red bag.","lighter","lightest",0],["Of all the cookies, this one is the ___.","sweeter","sweetest",1],["My sister is ___ than I am.","older","oldest",0],["Of the three mountains, this one is the ___.","higher","highest",1],["The rabbit is ___ than the turtle.","quicker","quickest",0],["Of all the students, Ava has the ___ backpack.","heavier","heaviest",1],["This movie is ___ than the last one.","longer","longest",0],["Of the three glasses, the blue one is the ___.","fuller","fullest",1],["My bedroom is ___ than my brother's.","cleaner","cleanest",0],["Of all the trees in the yard, the oak is the ___.","taller","tallest",1],["The green apple is ___ than the red apple.","sourer","sourest",0],["Of the three puppies, the brown one is the ___.","louder","loudest",1],["This chair is ___ than the wooden bench.","softer","softest",0],["Of the five sandwiches, mine is the ___.","bigger","biggest",1],["The river is ___ than the creek.","wider","widest",0],["Of the three hills, the first one is the ___.","steeper","steepest",1],["This math problem is ___ than the last one.","harder","hardest",0],["Of all the flowers, the sunflower is the ___.","taller","tallest",1]];
let index=0, answers=Array(30).fill(null), firstTry=Array(30).fill(null), hintShown=false;
const $=id=>document.getElementById(id);
function render(){const q=data[index];$('counter').textContent=`${index+1} / 30`;$('progress').style.width=`${(index+1)/30*100}%`;$('question').textContent=q[0];$('answers').innerHTML='';q.slice(1,3).forEach((word,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=word;if(answers[index]===i)b.classList.add(i===q[3]?'correct':'wrong');b.onclick=()=>choose(i);$('answers').appendChild(b)});$('feedback').textContent=answers[index]===null?'':answers[index]===q[3]?'✓ Correct! '+(q[3]===0?'We compare two things with -er.':'We use -est for the highest degree in a group.'):'Not quite. Think about how many things are being compared, then try again.';$('prev').disabled=index===0;$('next').textContent=index===29?'Finish ✓':'Next →'}
function choose(i){if(firstTry[index]===null)firstTry[index]=i===data[index][3];answers[index]=i;render()}
$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index===29){$('game').style.display='none';$('end').style.display='block';const attempted=firstTry.filter(x=>x!==null).length, correct=firstTry.filter(x=>x===true).length;$('summary').textContent=`You answered ${attempted} of 30 questions. Correct on the first try: ${correct} of ${attempted}.`; }else{index++;render()}};$('hint').onclick=()=>alert('Comparative (-er): compare two things, often using “than.”\nSuperlative (-est): choose the one with the most of a quality from a group, often using “the.”');$('restart').onclick=()=>{index=0;answers.fill(null);firstTry.fill(null);$('game').style.display='block';$('end').style.display='none';render()};render();
</script></body></html>
