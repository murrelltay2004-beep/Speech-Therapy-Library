<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wonder Woman Movie Talk Mission</title><style>body{font-family:Arial,sans-serif;background:#f5f0fa;color:#242039;margin:0}main{max-width:850px;margin:25px auto;padding:24px}.panel{background:white;border-radius:22px;padding:28px;box-shadow:0 6px 25px #30204418}h1{color:#563a8c}h2{font-size:1.7rem}button{font-size:1.1rem;border:2px solid #7154a0;background:white;border-radius:14px;padding:14px 20px;cursor:pointer;margin:6px}button:hover,button:focus{background:#eee3fc}button.selected{background:#d9c8f3;border-color:#44247c}button.primary{background:#593b8e;color:white}button:disabled{opacity:.35}input{font-size:1.2rem;padding:12px;border-radius:10px;border:1px solid #aaa;width:90%;max-width:480px}.muted{color:#625b70}.prompt{background:#f1eaf9;padding:16px;border-radius:12px;margin-top:20px}.bar{height:10px;background:#e9e2ef;border-radius:10px;overflow:hidden}.fill{height:100%;background:#7654a5}#feedback{min-height:25px;font-weight:bold;color:#4b3479}nav{display:flex;justify-content:space-between;align-items:center;margin-top:25px;flex-wrap:wrap}.tag{display:inline-block;background:#efe2ff;padding:7px 12px;border-radius:25px}#summary{white-space:pre-wrap;line-height:1.8}@media(max-width:550px){main{padding:10px}.panel{padding:18px}button{width:100%;margin:5px 0}}</style></head><body><main><div class="panel"><div class="tag">🦸‍♀️ Movie Talk Mission</div><h1>Wonder Woman</h1><p class="muted">Choose • Talk • Ask • Share</p><div class="bar"><div class="fill" id="fill"></div></div><p id="count"></p><section id="activity"></section><p id="feedback" aria-live="polite"></p><nav><button id="back">← Back</button><button id="next" class="primary">Next →</button></nav></div></main><script>
const steps=[
{title:'Which movie are we talking about?',options:['Wonder Woman','Batman Begins'],cue:'Say: “I want to talk about Wonder Woman.”',kind:'choice'},
{title:'Who is the main superhero?',options:['Wonder Woman','Superman'],cue:'Tell me something you know about her.',kind:'choice'},
{title:'What does Wonder Woman use?',options:['A lasso','A skateboard'],cue:'Tell me what her lasso can do.',kind:'choice'},
{title:'Where does Diana grow up?',options:['On an island','On the moon'],cue:'The island is called Themyscira. Can you say where she grew up?',kind:'choice'},
{title:'Who is Diana?',options:['Wonder Woman','Batman'],cue:'Try a whole sentence: “Diana is ___.”',kind:'choice'},
{title:'What is your favorite thing about Wonder Woman?',options:['Her strength','Her costume','Her lasso','Something else'],cue:'Use “I like ___ because ___.”',kind:'choice'},
{title:'Would you like to own this movie?',options:['Yes, please!','No, thank you.','I already own it.'],cue:'Ask for it in a complete sentence, or tell me about your copy.',kind:'choice'},
{title:'Which version would you choose?',options:['DVD','Blu-ray','Digital','I am not sure'],cue:'Tell me why you chose that version.',kind:'choice'},
{title:'Where would you put the movie?',options:['On my movie shelf','In a drawer','Somewhere else'],cue:'Describe where you keep your movies.',kind:'choice'},
{title:'Who would you watch Wonder Woman with?',options:['My family','A friend','By myself','Someone else'],cue:'Say: “I would watch it with ___.”',kind:'choice'},
{title:'What happens when Diana helps people?',options:['She protects them','She ignores them'],cue:'Tell me about a time someone helped you.',kind:'choice'},
{title:'How might Diana feel before a big battle?',options:['Brave','Nervous','Both'],cue:'There can be more than one good answer. Tell me why.',kind:'choice'},
{title:'Tell me about a scene you remember.',kind:'text',placeholder:'My favorite scene is...',cue:'What happened first? What happened next?'},
{title:'Ask your therapist a movie question!',options:['Have you seen Wonder Woman?','Who is your favorite superhero?','Do you like superhero movies?'],cue:'Ask the question out loud, then listen to the answer. Ask one follow-up!',kind:'choice'},
{title:'Your turn: tell me something!',options:['I like Wonder Woman because...','My favorite movie is...','I want to show you...'],cue:'Finish your sentence and wait for your therapist to respond.',kind:'choice'},
{title:'Compare two superheroes.',options:['Wonder Woman and Batman','Wonder Woman and Superman'],cue:'How are they the same? How are they different?',kind:'choice'},
{title:'Make a movie wish list!',kind:'text',placeholder:'Type a movie you want...',cue:'Ask: “Can I add ___ to my Christmas list?”'},
{title:'One last question for your therapist!',options:['Which movie should we talk about next?','Do you like Wonder Woman?','What movie did you watch recently?'],cue:'Ask out loud and respond to what your therapist says.',kind:'choice'}
];let index=0;const responses={};const $=id=>document.getElementById(id);function render(){const s=steps[index];$('fill').style.width=((index+1)/steps.length*100)+'%';$('count').textContent=`Activity ${index+1} of ${steps.length}`;const section=$('activity');section.replaceChildren();let h=document.createElement('h2');h.textContent=s.title;section.append(h);if(s.kind==='text'){let inp=document.createElement('input');inp.placeholder=s.placeholder;inp.value=responses[index]||'';inp.addEventListener('input',()=>responses[index]=inp.value);section.append(inp)}else{let area=document.createElement('div');s.options.forEach(o=>{let b=document.createElement('button');b.textContent=o;if(responses[index]===o)b.classList.add('selected');b.onclick=()=>{responses[index]=o;render();$('feedback').textContent='Nice choice! Tell me more.'};area.append(b)});section.append(area)}let p=document.createElement('div');p.className='prompt';p.innerHTML='<strong>🎤 Let’s talk:</strong> ';p.append(document.createTextNode(s.cue));section.append(p);$('feedback').textContent='';$('back').disabled=index===0;$('next').textContent=index===steps.length-1?'See My Movie Talk Summary →':'Next →'}$('back').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<steps.length-1){index++;render()}else summary()};function summary(){const section=$('activity');section.replaceChildren();let h=document.createElement('h2');h.textContent='🎉 Great Movie Talk!';section.append(h);let p=document.createElement('p');p.textContent='You made choices, shared ideas, and practiced asking questions!';section.append(p);let d=document.createElement('div');d.id='summary';d.textContent=steps.map((s,i)=>responses[i]?s.title+'\n'+responses[i]:'').filter(Boolean).join('\n\n');section.append(d);$('count').textContent='Mission complete';$('fill').style.width='100%';$('feedback').textContent='';$('back').disabled=false;$('back').onclick=()=>{index=steps.length-1;render()};$('next').textContent='Start Again ↻';$('next').onclick=()=>{index=0;Object.keys(responses).forEach(k=>delete responses[k]);$('back').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<steps.length-1){index++;render()}else summary()};render()};let print=document.createElement('button');print.textContent='Print My Answers';print.onclick=()=>window.print();section.append(print)}render();</script></body></html>
