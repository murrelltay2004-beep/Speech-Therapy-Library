<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real-Life Decisions | Problem Solving for Teens</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#17243a;background:#f3f6fb}body{margin:0}main{max-width:850px;margin:30px auto;padding:18px}.panel{background:white;border-radius:18px;padding:26px;box-shadow:0 6px 26px #14213d16}h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px)}.muted{color:#52647b}.tag{display:inline-block;background:#e7efff;border-radius:30px;padding:6px 12px;font-weight:700;font-size:13px}h2{font-size:24px;margin:20px 0 12px}.scenario{font-size:21px;line-height:1.5;background:#edf3ff;border-left:5px solid #3566bc;border-radius:9px;padding:20px;margin:18px 0}label{display:block;font-weight:700;margin:18px 0 7px}textarea{width:100%;box-sizing:border-box;min-height:70px;border:2px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit;resize:vertical}button{border:0;border-radius:10px;background:#254e99;color:white;padding:12px 17px;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#e8eef8;color:#1c396e}button:disabled{opacity:.35;cursor:not-allowed}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:22px}.hint{background:#fff7e5;padding:14px;border-radius:10px;margin-top:15px}.score{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.score button{background:#e8eef8;color:#1c396e}.score button.active{background:#254e99;color:white}.bar{height:9px;background:#dbe5f2;border-radius:9px;overflow:hidden;margin-top:15px}.fill{height:100%;background:#3566bc;width:4%}.small{font-size:13px}#summary{display:none}ul{line-height:1.8}@media print{button{display:none!important}body{background:white}main{margin:0}.panel{box-shadow:none}}</style></head><body><main><section class="panel" id="activity"><span class="tag">HIGH SCHOOL • TRANSITION SKILLS</span><h1>Real-Life Decisions</h1><p class="muted">Identify the problem • Give TWO different solutions • Explain your choice</p><div class="bar"><div class="fill" id="bar"></div></div><p class="muted" id="counter"></p><span class="tag" id="category"></span><div class="scenario" id="scenario"></div><label for="problem">1. What is the main problem?</label><textarea id="problem" placeholder="Describe what needs to be solved..."></textarea><label for="solution1">2. What is one realistic solution?</label><textarea id="solution1" placeholder="One thing the person could do..."></textarea><label for="solution2">3. What is a DIFFERENT solution?</label><textarea id="solution2" placeholder="Another way to handle it..."></textarea><label for="reason">4. Which solution would you choose, and why?</label><textarea id="reason" placeholder="Explain your reasoning..."></textarea><div class="score"><span class="muted">Therapist rating:</span><button class="secondary" data-rating="Independent">Independent</button><button class="secondary" data-rating="With cues">With cues</button><button class="secondary" data-rating="Not yet">Not yet</button></div><button class="secondary" id="reveal">Show possible responses</button><div class="hint" id="hint" hidden></div><div class="controls"><button class="secondary" id="prev">← Previous</button><button id="next">Next →</button></div></section><section class="panel" id="summary"><h1>Session Summary</h1><p id="stats"></p><button id="print">Print summary</button> <button class="secondary" id="restart">Start over</button><div id="details"></div></section></main><script>
const items=[
['Work','Your manager asks you to stay an extra hour, but you already promised to pick up a family member.','Explain the scheduling conflict; ask whether someone else can cover or whether you can help at another time.'],
['Money','You want to buy a new game, but you also need money for your phone bill next week.','Set aside the phone-bill money first; delay the purchase or look for a less expensive option.'],
['Friends','A friend shares an embarrassing photo of you in a group chat without asking.','Ask them privately to delete it; leave the chat and seek support if the sharing continues.'],
['Transportation','Your ride to work cancels 30 minutes before your shift.','Contact another reliable ride or transportation option; notify your supervisor immediately about the delay.'],
['School','You have two major assignments due tomorrow and not enough time to finish both perfectly.','Prioritize by due time and importance; contact a teacher to discuss an extension or partial submission.'],
['Work','A coworker keeps asking you to do their tasks while they take breaks.','Set a polite boundary; discuss the ongoing issue with a supervisor if it continues.'],
['Online Safety','Someone you met online asks for your address and says you should keep it secret.','Do not share personal information; block/report the account and tell a trusted adult.'],
['Communication','You receive a text that sounds rude, but you are not sure what the person meant.','Ask for clarification without accusing them; wait until you are calm and discuss it directly.'],
['Independent Living','You discover you are out of an ingredient halfway through making dinner.','Use an appropriate substitute; change the meal plan based on what is available.'],
['Money','You notice a charge on your bank account that you do not recognize.','Review recent purchases and subscriptions; contact the bank promptly to investigate.'],
['Work','Your boss gives you instructions you do not fully understand.','Ask them to explain or demonstrate; repeat the instructions back to check your understanding.'],
['Relationships','Two friends invite you to different events at the same time, and both expect you to attend.','Choose one and communicate respectfully; see whether you can attend part of each if practical.'],
['School','You disagree with a grade but do not understand why points were deducted.','Review the rubric and ask the teacher for feedback; request a chance to revise if allowed.'],
['Transportation','You miss the bus and have an appointment you cannot easily reschedule.','Check for a safe alternate ride; call the office to explain and ask about options.'],
['Work','A customer becomes angry about a store policy you cannot change.','Stay calm and explain the policy; ask a supervisor to assist if the issue continues.'],
['Money','Your friend wants to borrow money but has not repaid what they borrowed before.','Politely decline; offer nonfinancial help if you want to support them.'],
['Health & Safety','You start feeling sick during your shift at work.','Tell your supervisor and discuss leaving; follow workplace illness procedures and seek medical advice if needed.'],
['Communication','You accidentally send a message to the wrong person and it causes confusion.','Quickly explain and apologize; send the correct information to the intended person.'],
['Independent Living','You are responsible for waking up on time, but you have overslept twice this week.','Set multiple alarms and prepare the night before; adjust your sleep schedule and ask for temporary backup reminders.'],
['Work','You make a mistake on a task and are worried your manager will be upset.','Tell your manager promptly and suggest a correction; ask for guidance to prevent the mistake again.'],
['Social Decisions','Friends pressure you to skip an important responsibility to hang out.','Say no and explain your priority; suggest another time to meet.'],
['Technology','Your phone stops working while you are away from home and need directions.','Ask a trusted employee for help accessing directions; use a printed route or another safe navigation option.'],
['Future Planning','You are interested in a job but do not meet every qualification listed.','Apply and explain relevant strengths; look for training or entry-level roles that build the missing skills.'],
['Conflict','A roommate repeatedly leaves shared spaces messy even after you have cleaned them.','Agree on a specific cleaning schedule; have a calm conversation about shared expectations.'],
['Decision Making','You are offered a job with higher pay but a much longer commute.','Compare take-home pay after travel costs; consider schedule, reliability, and long-term goals before deciding.']
];let index=0;let responses=items.map(()=>({problem:'',solution1:'',solution2:'',reason:'',rating:''}));const $=id=>document.getElementById(id);function save(){for(const f of ['problem','solution1','solution2','reason'])responses[index][f]=$(f).value}function render(){const item=items[index],r=responses[index];$('counter').textContent=`Scenario ${index+1} of ${items.length}`;$('bar').style.width=`${(index+1)/items.length*100}%`;$('category').textContent=item[0];$('scenario').textContent=item[1];for(const f of ['problem','solution1','solution2','reason'])$(f).value=r[f];document.querySelectorAll('[data-rating]').forEach(b=>b.classList.toggle('active',b.dataset.rating===r.rating));$('hint').hidden=true;$('hint').textContent='Possible approaches (not the only correct answers): '+item[2];$('reveal').textContent='Show possible responses';$('prev').disabled=index===0;$('next').textContent=index===items.length-1?'Finish & view summary →':'Next →'}$('prev').onclick=()=>{save();index--;render()};$('next').onclick=()=>{save();if(index===items.length-1){showSummary()}else{index++;render()}};$('reveal').onclick=()=>{const h=$('hint');h.hidden=!h.hidden;$('reveal').textContent=h.hidden?'Show possible responses':'Hide possible responses'};document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{responses[index].rating=b.dataset.rating;render()});function showSummary(){$('activity').style.display='none';$('summary').style.display='block';let rated=responses.filter(r=>r.rating);$('stats').textContent=`${rated.length} of ${items.length} scenarios rated • ${rated.filter(r=>r.rating==='Independent').length} independent • ${rated.filter(r=>r.rating==='With cues').length} with cues • ${rated.filter(r=>r.rating==='Not yet').length} not yet`;$('details').innerHTML='';responses.forEach((r,i)=>{if(!Object.values(r).some(Boolean))return;let d=document.createElement('div');d.style.cssText='border-top:1px solid #ddd;padding:12px 0';let h=document.createElement('strong');h.textContent=`${i+1}. ${items[i][0]} — ${r.rating||'Unrated'}`;d.append(h);for(let [label,key] of [['Problem','problem'],['Solution 1','solution1'],['Solution 2','solution2'],['Reason','reason']]){let p=document.createElement('p');p.textContent=label+': '+(r[key]||'—');d.append(p)}$('details').append(d)})} $('print').onclick=()=>window.print();$('restart').onclick=()=>{responses=items.map(()=>({problem:'',solution1:'',solution2:'',reason:'',rating:''}));index=0;$('activity').style.display='block';$('summary').style.display='none';render()};render();</script></body></html>
